<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cuentas | Franco Systems</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-app" data-page="accounts">
<div class="erp-layout">
  <div id="sidebarMount"></div>
  <div class="erp-principal">
    <div id="topbarMount"></div>
    <main class="erp-content">
      <div id="setupAlert" class="alert warning hidden"></div>
      <section class="page-heading">
        <span class="kicker">SISTEMA</span>
        <h1>Cuentas</h1>
        <p>Administra bancos y billeteras digitales que pueden mostrarse en las cotizaciones.</p>
      </section>

      <section class="panel cuentas-panel">
        <div class="panel-cabecera">
          <div>
            <h2 id="tituloFormulario">Nueva Cuenta</h2>
            <p>Configura los datos exactamente como aparecerán en el documento.</p>
          </div>
        </div>

        <form id="cuentaForm" class="cuentas-form-grid" autocomplete="off">
          <div class="cuenta-campo">
            <label for="tipoCuenta">Tipo</label>
            <select id="tipoCuenta" class="select">
              <option value="BANCO">BANCO</option>
              <option value="BILLETERA">BILLETERA DIGITAL</option>
            </select>
          </div>

          <div class="cuenta-campo">
            <label for="entidadCuenta">Entidad</label>
            <select id="entidadCuenta" class="select"></select>
          </div>

          <div class="cuenta-campo cuenta-campo-ancho" id="grupoNombrePersonalizado" style="display:none">
            <label for="nombrePersonalizado">Nombre personalizado</label>
            <input id="nombrePersonalizado" class="input" placeholder="Nombre del banco o billetera">
          </div>

          <div class="cuenta-campo" id="grupoMoneda">
            <label for="monedaCuenta">Moneda</label>
            <select id="monedaCuenta" class="select">
              <option value="SOLES">SOLES</option>
              <option value="DOLARES">DÓLARES</option>
            </select>
          </div>

          <div class="cuenta-campo" id="grupoNumeroCuenta">
            <label for="numeroCuenta">N.º Cuenta</label>
            <input id="numeroCuenta" class="input" placeholder="Número de cuenta">
          </div>

          <div class="cuenta-campo" id="grupoCCI">
            <label for="cciCuenta">CCI</label>
            <input id="cciCuenta" class="input" placeholder="Código interbancario">
          </div>

          <div class="cuenta-campo" id="grupoCelular" style="display:none">
            <label for="celularCuenta">Número / Celular</label>
            <input id="celularCuenta" class="input" placeholder="Número de Yape / Plin">
          </div>

          <div class="cuenta-campo cuenta-campo-ancho">
            <label for="titularCuenta">Titular</label>
            <input id="titularCuenta" class="input" placeholder="Nombre del titular">
          </div>

          <div class="cuenta-campo cuenta-campo-ancho">
            <label>Logo de la cuenta</label>
            <div class="cuenta-logo-area">
              <div class="cuenta-logo-preview">
                <img id="previewLogoCuenta" alt="Logo" style="display:none">
                <span id="textoLogoCuenta">Sin logo</span>
              </div>
              <label class="btn btn-soft" for="logoCuenta">Seleccionar imagen</label>
              <input id="logoCuenta" type="file" accept="image/png,image/jpeg,image/webp" hidden>
            </div>
          </div>

          <div class="cuenta-campo cuenta-campo-ancho">
            <label class="check-row"><input id="mostrarPdf" type="checkbox" checked> Mostrar esta cuenta en la cotización / PDF</label>
          </div>

          <div class="cuentas-form-acciones cuenta-campo-ancho">
            <button id="btnCancelarCuenta" type="button" class="btn btn-secondary">Limpiar</button>
            <button id="btnGuardarCuenta" type="submit" class="btn btn-primary">Guardar Cuenta</button>
          </div>
        </form>
      </section>

      <section class="panel cuentas-panel">
        <div class="cuentas-lista-cabecera">
          <div>
            <h2>Cuentas registradas</h2>
            <p><span id="contadorCuentas">0</span> medio(s) de pago configurado(s).</p>
          </div>
        </div>
        <div id="sinCuentas" class="empty">Todavía no hay cuentas registradas.</div>
        <div id="listaCuentas" class="cuentas-grid"></div>
      </section>
    </main>
  </div>
  <div id="bottomMount"></div>
</div>
<script src="js/api.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/pwa.js"></script>
<script src="js/cuentas.js"></script>
</body>
</html>
