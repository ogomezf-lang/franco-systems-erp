<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cotizaciones | Franco Systems</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-app" data-page="quotes">
<div class="erp-layout">
  <div id="sidebarMount"></div>
  <div class="erp-principal">
    <div id="topbarMount"></div>
    <main class="erp-content">
      <div id="setupAlert" class="alert warning hidden"></div>
      <section class="page-heading">
        <span class="kicker">VENTAS</span>
        <h1>Cotizaciones</h1>
        <p>Consulta, edita, anula o reactiva las cotizaciones registradas.</p>
      </section>

      <section class="panel historial-panel">
        <div class="panel-cabecera historial-cabecera">
          <div><h2>Historial de Cotizaciones</h2><p>Busca por número, cliente o documento.</p></div>
          <a class="btn btn-primary" href="nueva-cotizacion.html">+ Nueva Cotización</a>
        </div>
        <div class="historial-controles">
          <input id="buscarCotizacion" class="input" placeholder="Buscar cotización...">
          <div class="historial-filtros">
            <button type="button" class="filtro-cotizacion activo" data-filtro="TODAS">Todas</button>
            <button type="button" class="filtro-cotizacion" data-filtro="ACTIVA">Activas</button>
            <button type="button" class="filtro-cotizacion" data-filtro="ANULADA">Anuladas</button>
          </div>
        </div>
        <div class="tabla-contenedor">
          <table class="tabla-cotizaciones card-table">
            <thead><tr><th>N.º</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tablaCotizaciones"><tr><td colspan="6" class="empty">Cargando...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div id="bottomMount"></div>
</div>
<script src="js/api.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/pwa.js"></script>
<script src="js/cotizaciones.js"></script>
</body>
</html>
